<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#302b63" />
      <stop offset="100%" stop-color="#24243e" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00dfd8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M 0 40 L 1200 40 M 0 80 L 1200 80 M 0 120 L 1200 120 M 0 160 L 1200 160 M 0 200 L 1200 200 M 0 240 L 1200 240 M 0 280 L 1200 280" />
    <path d="M 100 0 L 100 320 M 200 0 L 200 320 M 300 0 L 300 320 M 400 0 L 400 320 M 500 0 L 500 320 M 600 0 L 600 320 M 700 0 L 700 320 M 800 0 L 800 320 M 900 0 L 900 320 M 1000 0 L 1000 320 M 1100 0 L 1100 320" />
  </g>

  <!-- Controller Icon / Graphic (Left Decor) -->
  <g transform="translate(90, 100)" fill="none" stroke="url(#textGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="0" y="0" width="120" height="80" rx="20" />
    <!-- D-Pad -->
    <path d="M 30 30 L 30 50 M 20 40 L 40 40" />
    <!-- Buttons -->
    <circle cx="85" cy="32" r="4" fill="#00dfd8" />
    <circle cx="97" cy="44" r="4" fill="#ff007f" />
    <circle cx="73" cy="44" r="4" fill="#7928ca" />
    <circle cx="85" cy="56" r="4" fill="#ffeb3b" />
  </g>

  <!-- Title Text -->
  <text x="630" y="130" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="1">
    AWESOME VIDEO GAME COMPILATION
  </text>

  <!-- Subtitle -->
  <text x="630" y="180" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="20" fill="#e0e0e0" letter-spacing="2">
    TOP COMMERCIAL REMASTERS, DECOMPILATIONS &amp; UNIFIED LAUNCHERS
  </text>

  <!-- Tags / Badges Graphic in Banner -->
  <g transform="translate(630, 225)">
    <!-- Badge 1 -->
    <rect x="-240" y="0" width="130" height="30" rx="15" fill="#ff007f" fill-opacity="0.2" stroke="#ff007f" stroke-width="1.5" />
    <text x="-175" y="20" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#ff007f">🎮 REMASTERS</text>
    
    <!-- Badge 2 -->
    <rect x="-95" y="0" width="150" height="30" rx="15" fill="#7928ca" fill-opacity="0.2" stroke="#7928ca" stroke-width="1.5" />
    <text x="-20" y="20" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#b871ff">⚡ RECOMPILATIONS</text>

    <!-- Badge 3 -->
    <rect x="70" y="0" width="170" height="30" rx="15" fill="#00dfd8" fill-opacity="0.2" stroke="#00dfd8" stroke-width="1.5" />
    <text x="155" y="20" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#00dfd8">🚀 UNIFIED LAUNCHERS</text>
  </g>
</svg>
